<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="120" fill="none">
  <defs>
    <linearGradient id="printerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Printer Icon Container -->
  <g transform="translate(15, 20)" filter="url(#shadow)">
    <!-- Rounded Background Tile -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#printerGrad)" />
    
    <!-- Printer SVG Artwork -->
    <!-- Top Paper Feed -->
    <rect x="25" y="16" width="30" height="14" rx="2" fill="#ffffff" opacity="0.9" />
    <line x1="30" y1="21" x2="44" y2="21" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="25" x2="50" y2="25" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Printer Body -->
    <rect x="16" y="27" width="48" height="26" rx="6" fill="#ffffff" />
    <!-- Scanner glass gap / accent line -->
    <rect x="22" y="32" width="36" height="3" rx="1.5" fill="#e2e8f0" />
    <!-- Status LED (Green) -->
    <circle cx="58" cy="38" r="2" fill="#10b981" />
    <circle cx="52" cy="38" r="2" fill="#3b82f6" />

    <!-- Paper Output Tray & Ejected Sheet -->
    <path d="M 20 48 L 60 48 L 56 62 L 24 62 Z" fill="#e2e8f0" />
    <rect x="25" y="44" width="30" height="14" rx="2" fill="#ffffff" />
    <!-- Paper lines on printout -->
    <line x1="29" y1="49" x2="45" y2="49" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="29" y1="53" x2="40" y2="53" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography: 'PrinterPing' using SF Pro Display style font stack -->
  <g transform="translate(112, 74)">
    <text x="0" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 'Helvetica Neue', Arial, sans-serif" 
          font-size="44" 
          font-weight="700" 
          letter-spacing="-1.2" 
          fill="#0f172a">
      Printer<tspan fill="#2563eb">Ping</tspan>
    </text>

    <!-- Red Notification Dot directly above the last 'g' in Ping -->
    <!-- 'Printer' ~ 145px, 'Pin' ~ 72px, 'g' center around 239px, top of lowercase letter around -34px -->
    <circle cx="237" cy="-35" r="5" fill="#ef4444" filter="url(#glow)"/>
    <circle cx="237" cy="-35" r="4.5" fill="#ef4444"/>
    <circle cx="235.5" cy="-36.5" r="1.5" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
