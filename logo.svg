<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="120" fill="none">
  <!-- PrinterPing Brand Logo: White & Blue with 1px black stroke -->
  <defs>
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Icon Container -->
  <g transform="translate(16, 20)" filter="url(#crispShadow)">
    <!-- Base App Icon Tile: Blue background, 1px black stroke -->
    <rect x="0.5" y="0.5" width="79" height="79" rx="18" fill="#0284c7" stroke="#000000" stroke-width="1" />
    
    <!-- Top Paper Tray / Input Sheet: Pure White, 1px black stroke -->
    <rect x="25.5" y="15.5" width="29" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <line x1="30.5" y1="21.5" x2="44.5" y2="21.5" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30.5" y1="26.5" x2="49.5" y2="26.5" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Printer Main Chassis: Pure White with 1px black stroke -->
    <rect x="15.5" y="27.5" width="49" height="27" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <!-- Cyan/Blue Scanner Bay line -->
    <rect x="22.5" y="32.5" width="35" height="3" rx="1.5" fill="#38bdf8" stroke="#000000" stroke-width="1" />
    
    <!-- LED Indicators: Cyan & White, with 1px black stroke -->
    <circle cx="57.5" cy="40.5" r="2.5" fill="#38bdf8" stroke="#000000" stroke-width="1" />
    <circle cx="50.5" cy="40.5" r="2.5" fill="#ffffff" stroke="#000000" stroke-width="1" />

    <!-- Paper Output Feed Tray -->
    <path d="M 20.5 49.5 L 59.5 49.5 L 55.5 63.5 L 24.5 63.5 Z" fill="#e0f2fe" stroke="#000000" stroke-width="1" />
    
    <!-- Printed Sheet Emerging: White with 1px black stroke and blue details -->
    <rect x="25.5" y="45.5" width="29" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <line x1="29.5" y1="51.5" x2="46.5" y2="51.5" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="29.5" y1="55.5" x2="41.5" y2="55.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography: 'PrinterPing' White & Blue with 1px Black Stroke -->
  <g transform="translate(116, 74)">
    <text x="0" y="0" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Inter, sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="-1">
      <tspan fill="#ffffff" stroke="#000000" stroke-width="1" paint-order="stroke fill">Printer</tspan>
      <tspan fill="#0284c7" stroke="#000000" stroke-width="1" paint-order="stroke fill">Ping</tspan>
    </text>

    <!-- Ping Notification Pulse Rings & Badge: White & Blue with 1px black stroke -->
    <circle cx="242" cy="-34" r="8" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.8" />
    <circle cx="242" cy="-34" r="5" fill="#38bdf8" stroke="#000000" stroke-width="1" />
    <circle cx="240.5" cy="-35.5" r="1.5" fill="#ffffff" />
  </g>
</svg>
