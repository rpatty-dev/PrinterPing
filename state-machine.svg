<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-title state-desc" style="width: 100%; max-width: 960px; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Geist', 'Segoe UI', Roboto, sans-serif;">
  <title id="state-title">PrinterPing Smart Inventory State Machine</title>
  <desc id="state-desc">State machine diagram showing how PrinterPing transitions between Healthy, Low Supply, Spare Standby, Critical Replacement, and Auto-Restock states.</desc>

  <defs>
    <!-- Background Dot Grid -->
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.6"/>
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Clean Canvas Paper -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#dot-grid)"/>

  <!-- Top Header Subtitle & Title -->
  <g transform="translate(36, 42)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-family="ui-monospace, 'Geist Mono', monospace" font-weight="600" letter-spacing="0.12em" text-transform="uppercase">FINITE STATE MACHINE · RFC 3805 TELEMETRY</text>
    <text x="0" y="24" fill="#0f172a" font-size="20" font-weight="700" letter-spacing="-0.02em">PrinterPing Lifecycle &amp; Spare Inventory Engine</text>
  </g>

  <!-- ==================== TRANSITIONS / EDGES ==================== -->

  <!-- Start -> Initializing / Polling -->
  <line x1="60" y1="210" x2="100" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Normal Loop: Polling -> Nominal State -->
  <line x1="240" y1="210" x2="280" y2="210" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- Nominal -> Low Branch with Spare (Upper path to Spare Standby) -->
  <path d="M 440 185 C 490 185, 490 140, 540 140" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Nominal -> Low Branch No Spare (Lower path to Order Required) -->
  <path d="M 440 235 C 490 235, 490 280, 540 280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Spare Standby -> Critical Replacement (when level <= 5%) -->
  <line x1="700" y1="140" x2="760" y2="140" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Replace Now -> Swapped Cartridge (Downward loop to Auto-Restock Trigger) -->
  <path d="M 840 190 L 840 370 L 680 370" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-emerald)"/>

  <!-- Auto-Restock Trigger -> Loop back to Polling (Leftward restore path) -->
  <path d="M 520 370 L 170 370 L 170 260" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- Order Required -> Restocked back to Nominal -->
  <path d="M 620 330 C 620 400, 360 400, 360 260" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- ==================== TRANSITION LABELS ==================== -->

  <!-- Start -> Polling -->
  <text x="80" y="202" fill="#64748b" font-size="9" font-family="ui-monospace, monospace" text-anchor="middle">BOOT</text>

  <!-- Polling -> Nominal -->
  <rect x="245" y="196" width="30" height="14" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="260" y="206" fill="#059669" font-size="9" font-family="ui-monospace, monospace" font-weight="600" text-anchor="middle">&gt;15%</text>

  <!-- To Spare Standby -->
  <rect x="468" y="148" width="54" height="15" rx="3" fill="#ffffff" stroke="#bfdbfe" stroke-width="0.8"/>
  <text x="495" y="159" fill="#2563eb" font-size="8.5" font-family="ui-monospace, monospace" font-weight="600" text-anchor="middle">&#8804;15% [SPARE]</text>

  <!-- To Order Required -->
  <rect x="466" y="246" width="58" height="15" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="495" y="257" fill="#64748b" font-size="8.5" font-family="ui-monospace, monospace" font-weight="600" text-anchor="middle">&#8804;15% [NO SPARE]</text>

  <!-- To Replace Now -->
  <rect x="712" y="126" width="38" height="15" rx="3" fill="#ffffff" stroke="#fecaca" stroke-width="0.8"/>
  <text x="731" y="137" fill="#dc2626" font-size="8.5" font-family="ui-monospace, monospace" font-weight="600" text-anchor="middle">&#8804;5% CRIT</text>

  <!-- Swapped Action -->
  <rect x="785" y="280" width="110" height="28" rx="4" fill="#ffffff" stroke="#a7f3d0" stroke-width="0.8"/>
  <text x="840" y="293" fill="#059669" font-size="8.5" font-family="ui-monospace, monospace" font-weight="600" text-anchor="middle">PHYSICAL SWAP</text>
  <text x="840" y="304" fill="#64748b" font-size="8" font-family="ui-monospace, monospace" text-anchor="middle">Level jumps to 100%</text>

  <!-- Auto-Restock Action -->
  <rect x="290" y="358" width="130" height="16" rx="3" fill="#ffffff" stroke="#a7f3d0" stroke-width="0.8"/>
  <text x="355" y="369" fill="#059669" font-size="8.5" font-family="ui-monospace, monospace" font-weight="600" text-anchor="middle">STATE: SPARE = FALSE</text>

  <!-- ==================== STATE NODES ==================== -->

  <!-- Start Point (Ink Dot) -->
  <circle cx="50" cy="210" r="7" fill="#0f172a"/>

  <!-- State 1: Polling / SNMP Probe -->
  <g transform="translate(100, 165)">
    <rect width="140" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="10" y="10" width="36" height="14" rx="3" fill="#f1f5f9"/>
    <text x="28" y="20" fill="#64748b" font-size="8" font-family="ui-monospace, monospace" font-weight="600" text-anchor="middle">POLL</text>
    <text x="70" y="48" fill="#0f172a" font-size="14" font-weight="600" text-anchor="middle">SNMP Probe</text>
    <text x="70" y="66" fill="#64748b" font-size="10.5" text-anchor="middle">RFC 3805 MIB scan</text>
    <text x="70" y="79" fill="#94a3b8" font-size="9.5" text-anchor="middle">Hourly scheduler</text>
  </g>

  <!-- State 2: Nominal / Healthy -->
  <g transform="translate(280, 165)">
    <rect width="160" height="90" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.4"/>
    <rect x="10" y="10" width="46" height="14" rx="3" fill="#ecfdf5"/>
    <text x="33" y="20" fill="#059669" font-size="8" font-family="ui-monospace, monospace" font-weight="600" text-anchor="middle">HEALTHY</text>
    <text x="80" y="48" fill="#0f172a" font-size="14" font-weight="600" text-anchor="middle">Nominal Supply</text>
    <text x="80" y="66" fill="#059669" font-size="11" font-weight="500" text-anchor="middle">&gt;15% Capacity</text>
    <text x="80" y="79" fill="#64748b" font-size="9.5" text-anchor="middle">Silent monitoring</text>
  </g>

  <!-- State 3: Spare Standby (Muted Blue) -->
  <g transform="translate(540, 95)">
    <rect width="160" height="90" rx="8" fill="#f0f9ff" stroke="#3b82f6" stroke-width="1.4"/>
    <rect x="10" y="10" width="48" height="14" rx="3" fill="#dbeafe"/>
    <text x="34" y="20" fill="#2563eb" font-size="8" font-family="ui-monospace, monospace" font-weight="600" text-anchor="middle">STANDBY</text>
    <text x="80" y="48" fill="#1e3a8a" font-size="14" font-weight="600" text-anchor="middle">Spare on Hand</text>
    <text x="80" y="66" fill="#2563eb" font-size="10.5" text-anchor="middle">5% &lt; Level &#8804; 15%</text>
    <text x="80" y="79" fill="#64748b" font-size="9.5" text-anchor="middle">Alerts suppressed</text>
  </g>

  <!-- State 4: Order Required (Yellow / Amber) -->
  <g transform="translate(540, 235)">
    <rect width="160" height="90" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
    <rect x="10" y="10" width="46" height="14" rx="3" fill="#fef3c7"/>
    <text x="33" y="20" fill="#b45309" font-size="8" font-family="ui-monospace, monospace" font-weight="600" text-anchor="middle">REORDER</text>
    <text x="80" y="48" fill="#78350f" font-size="14" font-weight="600" text-anchor="middle">Order Required</text>
    <text x="80" y="66" fill="#b45309" font-size="10.5" text-anchor="middle">0 spares in stock</text>
    <text x="80" y="79" fill="#b45309" font-size="9.5" text-anchor="middle">Email &amp; ntfy dispatch</text>
  </g>

  <!-- State 5: Critical Replace Now (Focal Red/Coral) -->
  <g transform="translate(760, 95)">
    <rect width="160" height="90" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
    <rect x="10" y="10" width="46" height="14" rx="3" fill="#fee2e2"/>
    <text x="33" y="20" fill="#dc2626" font-size="8" font-family="ui-monospace, monospace" font-weight="600" text-anchor="middle">CRITICAL</text>
    <text x="80" y="48" fill="#991b1b" font-size="14" font-weight="700" text-anchor="middle">Replace Now</text>
    <text x="80" y="66" fill="#dc2626" font-size="10.5" font-weight="600" text-anchor="middle">Level &#8804; 5% cutoff</text>
    <text x="80" y="79" fill="#b91c1c" font-size="9.5" text-anchor="middle">Use in-stock cartridge</text>
  </g>

  <!-- State 6: Auto-Restock Replenishment Loop Node -->
  <g transform="translate(520, 340)">
    <rect width="160" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text x="80" y="27" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">Restock Alert Dispatched</text>
    <text x="80" y="45" fill="#047857" font-size="10" text-anchor="middle">Prompts order for backup spare</text>
  </g>

</svg>
